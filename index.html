<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container-fluid mt-4 px-4">

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-primary text-white text-center">
                <h3 class="mb-0">
                    <i class="fa-solid fa-users mr-2"></i>
                    Employee Management System
                </h3>
            </div>

            <div class="card-body">
                <div class="row">

                  
                    <div class="col-lg-4 mb-4">

                        <div class="card shadow-sm h-100">

                            <div class="card-header bg-dark text-white">
                                <h5 class="mb-0">
                                    <i class="fa-solid fa-user-plus mr-2"></i>
                                    Add Employee
                                </h5>
                            </div>

                            <div class="card-body">

                                <form id="empForm">

                                    <div class="form-group">
                                        <label for="eName">Employee Name</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="eName"
                                            placeholder="Enter employee name"
                                            required
                                        >
                                    </div>

                                    <div class="form-group">
                                        <label for="department">Department</label>
                                        <select
                                            class="form-control"
                                            id="department"
                                            required
                                        >
                                            <option value="" selected disabled>
                                                Select Department
                                            </option>
                                            <option value="Development">Development</option>
                                            <option value="Testing">Testing</option>
                                            <option value="HR">HR</option>
                                            <option value="Marketing">Marketing</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label for="salary">Salary (₹)</label>
                                        <input
                                            type="number"
                                            class="form-control"
                                            id="salary"
                                            placeholder="Enter salary"
                                            min="0"
                                            required
                                        >
                                    </div>

                                    <div class="form-group">
                                        <label for="city">City</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="city"
                                            placeholder="Enter city"
                                            required
                                        >
                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn-primary btn-block"
                                        id="submitBtn"
                                    >
                                        <i class="fa-solid fa-plus mr-2"></i>
                                        Add Employee
                                    </button>

                                    <button
                                        type="button"
                                        class="btn btn-success btn-block d-none"
                                        id="updateBtn"
                                    >
                                        <i class="fa-solid fa-pen-to-square mr-2"></i>
                                        Update Employee
                                    </button>

                                </form>

                            </div>
                        </div>

                    </div>

                 
                    <div class="col-lg-8 mb-4">

                        <div class="card shadow-sm h-100">

                            <div class="card-header bg-dark text-white">
                                <h5 class="mb-0">
                                    <i class="fa-solid fa-table-list mr-2"></i>
                                    Employee Records
                                </h5>
                            </div>

                            <div class="card-body p-0">

                                <div class="table-responsive">

                                    <table class="table table-hover table-striped mb-0">

                                        <thead class="thead-light">
                                            <tr>
                                                <th>Sr. No.</th>
                                                <th>Name</th>
                                                <th>Department</th>
                                                <th>Salary</th>
                                                <th>City</th>
                                                <th class="text-center">Edit</th>
                                                <th class="text-center">Delete</th>
                                            </tr>
                                        </thead>

                                        <tbody id="empInfo">
                                          
                                            <!-- <tr>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                                <td></td>
                                                <d></td>
                                                <td><button class="btn btn-sm btn-block btn-primary">Edit</button></td>
                                                <td><button class="btn btn-sm btn-block btn-danger">Remove</button></td>
                                            </tr> -->
                                       
                                        </tbody>

                                    </table>

                                </div>

                            </div>

                            <div class="card-footer bg-white text-muted">
                                <small>
                                    <i class="fa-solid fa-circle-info mr-1"></i>
                                    Add, edit, update and delete employee records.
                                </small>
                            </div>

                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>
   <div class="spinner d-none" id="spinner">
  <div class="spinner-border" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>

    
    <script src="./assets/js/app.js"></script>

</body>
</html>
